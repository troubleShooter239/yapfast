name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  formatting:
    name: formatting
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - uses: j178/prek-action@e255e0dfb748c18fd93df34c3eb853e9a999c6aa
        with:
          prek-version: "0.5.2"
      - run: cargo fmt --all -- --check

  dependencies:
    name: Dependencies (${{ matrix.tool }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tool: [cargo-audit, cargo-machete]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: ${{ matrix.tool }}
      - name: Audit dependencies (deny all warnings)
        if: matrix.tool == 'cargo-audit'
        # TODO: after fix audit errors reenable that line:
        # run: cargo audit --deny warning
        run: cargo audit --ignore RUSTSEC-2026-0459
      - name: Find unused dependencies
        if: matrix.tool == 'cargo-machete'
        run: cargo machete

  linux:
    name: clippy & tests
    needs: formatting
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      CC: clang-23
      CXX: clang++-23
      LIBCLANG_PATH: /usr/lib/llvm-23/lib
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Configure LLVM 23 packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          . /etc/os-release
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            -o "$RUNNER_TEMP/llvm-signing-key.asc"
          gpg --batch --yes --dearmor \
            --output "$RUNNER_TEMP/llvm-archive-keyring.gpg" \
            "$RUNNER_TEMP/llvm-signing-key.asc"
          sudo install -m 644 "$RUNNER_TEMP/llvm-archive-keyring.gpg" /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-23 libclang-23-dev llvm-23 cmake ninja-build nasm \
            pkg-config protobuf-compiler python3 libasound2-dev libpulse-dev \
            libfontconfig1-dev libfreetype6-dev libglib2.0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libssl-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev \
            libpipewire-0.3-dev libdrm-dev libgbm-dev libxfixes-dev \
            libxdamage-dev libxcomposite-dev libxext-dev
      - name: Verify native toolchain
        run: |
          "$CC" --version
          "$CXX" --version
          llvm-config-23 --version
          test -f "$LIBCLANG_PATH/libclang.so"
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: ci-linux
          cache-on-failure: true
      - name: Cargo Clippy
        run: cargo clippy --locked --workspace --exclude feature-union --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --locked --workspace --exclude feature-union
