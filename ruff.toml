# Keep scripts compatible with Python 3.13 outside the Nix shells as well.
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "venv", "vendor", ".local", "target", "node_modules"]

[lint]
select = ["E", "W", "F", "I"]

fixable = ["ALL"]

[format]
quote-style = "double"
docstring-code-format = true
